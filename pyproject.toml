[project]
name = "tikitaka-dwh"
version = "0.2.0"
description = "Offline-first data warehouse for Tikitaka POS clients"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.0",
    "httpx>=0.27",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "streamlit>=1.35",
    "keyring>=25.0",
    "platformdirs>=4.0",
    "pandas>=2.0",
    "pyarrow>=16.0",
    "python-dateutil>=2.9",
    "PyJWT>=2.8",
    "sentry-sdk>=2.0",
    "pytz>=2024.1",
    "openpyxl>=3.1",
    "cryptography>=42.0",
]

[project.scripts]
tikitaka-dwh = "tikitaka_dwh.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tikitaka_dwh"]

[tool.ruff]
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]
# Typographic characters used intentionally in UI strings, comments and docstrings
allowed-confusables = ["–", "−", "‘", "’", "×"]

[tool.mypy]
strict = true
python_version = "3.11"
mypy_path = "src"
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "ruff>=0.4",
    "mypy>=1.10",
    "pyinstaller>=6.0",
    "freezegun>=1.5",
    "pandas-stubs>=2.0",
]
