name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    # windows-latest because the shipped product is a Windows exe
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        # Python version comes from .python-version via uv

      - name: Install dependencies
        run: uv sync --dev

      - name: Lint (ruff)
        run: uv run ruff check src scripts tests

      - name: Type-check (mypy)
        run: uv run mypy src

      - name: Tests (pytest)
        run: uv run pytest --tb=short -q
